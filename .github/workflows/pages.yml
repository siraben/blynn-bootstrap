name: Pages

on:
  push:
    branches:
      - master
      - siraben/portable-alpine-jslinux
    paths:
      - demo/unkernel/**
      - flake.lock
      - flake.nix
      - nix/**
      - scripts/**
      - hcc/**
      - patches/**
      - data/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.5.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build unkernel demo
        run: nix build --print-build-logs .#unkernel-blynn-demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: result

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
